<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Vazirmatn:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- ── OpenGraph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InfraScope" />
    <meta
      property="og:title"
      content="InfraScope — Iran Network Infrastructure Analysis"
    />
    <meta
      property="og:description"
      content="Explore Iran's ASN topology, IP lookups, and BGP routing paths."
    />
    <meta property="og:url" content="https://infrascope.ir" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="{% block twitter_title %}InfraScope — Iran Network Infrastructure{% endblock %}"
    />
    <meta
      name="twitter:description"
      content="{% block twitter_description %}Explore Iran's ASN topology, IP lookups, and BGP routing paths.{% endblock %}"
    />
    <title>Infrascope</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
